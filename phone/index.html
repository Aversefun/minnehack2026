<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MinneFlight</title>
    <script src="main.js" defer></script>
  </head>
  <body>
    <div id="lobby-handler">
      <input id="lobby" value="" placeholder="Lobby here.">
      <button id="start-button">
        Press To Start
      </button>
    </div>
    <div class="container" id="game-display" style="display: none;">
      <div class="left-container">
        <button id="button-a" class="img-btn">A</button>
        <button id="button-b" class="img-btn">B</button>
      </div>
      <div class="center-container">
        <div id="debug-info"></div>
      </div>
      <div class="right-container">
        <button id="button-x" class="img-btn">X</button>
        <button id="button-y" class="img-btn">Y</button>
      </div>
    </div>

  </body>
  <style>
html, body {
  margin: 0;
  padding: 0;
}

#lobby-handler {
  display: flex;

  width: 100vw;
  height: 100vh;

  flex-direction: column;
  justify-content: center;
}

#start-button, #lobby {
  height: 10vh;
  margin-top: 1vw;
  margin-left: 10vw;
  margin-right: 10vw;
}

.container {
  grid-template-columns: 20vw auto 20vw;
  width: 100vw;
  height: 100vh;
}

.container button {
  aspect-ratio: 1;
}

.left-container, .right-container {
  background: black;
  display: flex;
  flex-direction: column;
  gap: 2em;
  padding: 2em;
}

.center-container {
  background: white;
}

  </style>
</html>
